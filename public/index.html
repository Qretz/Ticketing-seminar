<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi Tiket Seminar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Daftar Tiket Seminar</h1>

    <!-- STEP 1: Form data diri -->
    <form id="registerForm" class="card">
      <label for="name">Nama Lengkap</label>
      <input type="text" id="name" required>

      <label for="phone">Nomor Telepon</label>
      <input type="tel" id="phone" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="campus">Asal Kampus / Tempat Kerja</label>
      <input type="text" id="campus" required>

      <label for="password">Buat Password</label>
      <input type="password" id="password" minlength="6" required>
      <p class="note">Minimal 6 karakter. Dipake buat login lagi tanpa nunggu kode OTP.</p>

      <button type="submit">Daftar</button>
      <p id="registerError" class="error"></p>
    </form>

    <!-- STEP 2: Verifikasi OTP — disembunyiin dulu sampe register sukses -->
    <form id="otpForm" class="card hidden">
      <p>Kode verifikasi udah dikirim ke email kamu. Cek inbox (atau folder spam) ya.</p>
      <label for="otp">Kode Verifikasi (6 digit)</label>
      <input type="text" id="otp" maxlength="6" inputmode="numeric" required>
      <button type="submit">Verifikasi</button>
      <button type="button" id="resendBtn" class="secondary">Kirim Ulang Kode</button>
      <p id="otpError" class="error"></p>
    </form>

    <p class="auth-switch">Sudah punya akun? <a href="login.html">Login di sini</a></p>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
